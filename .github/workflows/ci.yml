# VaultOne CI：Rust 测试/静态检查 → 依赖安全审计 + SBOM → Flutter 分析/测试 → 多平台构建 → 发布签名
name: ci

on:
  push:
    branches: [main, DeepSeek41]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FLUTTER_VERSION: "3.47.5"

jobs:
  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.12.1+1'
          cache: maven
          cache-dependency-path: server/pom.xml
      - name: Java 格式、架构、Jetty 与真实 PG/Redis 集成测试
        run: bash ./mvnw --batch-mode verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-test-reports
          path: |
            server/target/surefire-reports/
            server/target/failsafe-reports/

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: 单元 + 端到端测试（含 FRB 桥，e2e 自启 SQLite 服务端）
        run: cargo test --locked --workspace
      - name: 服务端 PostgreSQL 冒烟（迁移 + 健康检查）
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=vaultone -p 5432:5432 postgres:16-alpine
          for i in $(seq 1 30); do docker exec pg pg_isready -U postgres && break; sleep 1; done
          VAULTONE_SERVER_SECRET=$(cargo run -q -p vault-server -- gen-secret) \
          VAULTONE_DATABASE_URL=postgres://postgres:ci@localhost:5432/vaultone \
          cargo run -q -p vault-server -- check
      - name: PostgreSQL 旧库升级（UTC 与非 UTC 会话）
        env:
          VAULTONE_MIGRATION_TEST_PG_URL: postgres://postgres:ci@127.0.0.1:5432/vaultone_migration_test
          VAULTONE_MIGRATION_TEST_PG_ALLOW: "1"
        run: |
          docker exec pg createdb -U postgres vaultone_migration_test
          cargo test --locked -p vault-server --test migration_upgrade postgres_ -- --ignored --nocapture
      - name: PostgreSQL 同步竞争与游标提交顺序
        env:
          VAULTONE_SYNC_TEST_PG_URL: postgres://postgres:ci@127.0.0.1:5432/vaultone_sync_test
          VAULTONE_SYNC_TEST_PG_ALLOW: "1"
        run: |
          docker exec pg createdb -U postgres vaultone_sync_test
          cargo test --locked -p vault-server --test sync_concurrency postgres_ -- --ignored --nocapture

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "llvm-tools-preview" }
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: 覆盖率门禁（计划书 B-09：加密内核 ≥ 90%）
        run: |
          cargo llvm-cov --locked -p vault-crypto --fail-under-lines 90 --summary-only
          cargo llvm-cov --locked -p vault-crypto -p vault-core -p vault-server --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        with: { name: coverage-lcov, path: lcov.info }

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@cargo-fuzz
      - name: 每个 fuzz 目标冒烟 60 s（长时间运行见 fuzz.yml）
        run: |
          for t in $(cargo +nightly fuzz list); do
            cargo +nightly fuzz run "$t" -- -max_total_time=60
          done

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: 语法检查 + 与 Rust 协议的交叉向量测试
        run: |
          for f in extension/*.js extension/lib/*.js; do node --check "$f"; done
          node --test extension/test/protocol.test.mjs
      - name: 打包（上传 Chrome 应用店 / Edge 加载项）
        run: cd extension && zip -r ../vaultone-extension.zip . -x 'test/*'
      - uses: actions/upload-artifact@v4
        with: { name: vaultone-extension, path: vaultone-extension.zip }

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with: { command: check advisories bans licenses sources }
      - name: SBOM（Syft，SPDX JSON）
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: vaultone-sbom.spdx.json
      - name: 漏洞扫描（Trivy，High/Critical 阻断发布）
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  flutter:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - working-directory: app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
      - name: 集成测试（真实 Rust 内核）
        working-directory: app
        run: flutter test integration_test -d windows
      - name: 构建 Windows Release
        working-directory: app
        run: flutter build windows --release --dart-define=VAULTONE_SERVER=${{ vars.VAULTONE_SERVER || 'https://sync.vaultone.app' }}
      - uses: actions/upload-artifact@v4
        with: { name: vaultone-windows, path: app/build/windows/x64/runner/Release }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - name: 注入发布签名（仅 tag 构建）
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: app/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > upload.jks
          cat > key.properties <<PROPS
          storeFile=../upload.jks
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          PROPS
      - working-directory: app
        run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with: { name: vaultone-android, path: app/build/app/outputs/bundle/release }

  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin" }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - working-directory: app
        run: |
          flutter build macos --release
          flutter build ios --release --no-codesign
      - name: 把浏览器扩展宿主放进 .app（签名前）
        run: |
          cargo build --release --locked -p vault-nmhost --target aarch64-apple-darwin
          cp target/aarch64-apple-darwin/release/vaultone-nmhost app/build/macos/Build/Products/Release/VaultOne.app/Contents/MacOS/

  server-image:
    needs: [rust, supply-chain]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          provenance: true
          sbom: true
          tags: ghcr.io/${{ github.repository }}/server:${{ github.ref_name }}
      - uses: sigstore/cosign-installer@v3
      - name: cosign 无密钥签名（计划书 §3.3 发布物签名）
        run: cosign sign --yes ghcr.io/${{ github.repository }}/server@${{ steps.build.outputs.digest }}
