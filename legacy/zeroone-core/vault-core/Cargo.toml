[package]
name = "vault-core"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "ZeroOne 客户端加密内核：密钥层级、条目加解密、本地保险库、密码生成器、TOTP"
publish = false

[lib]
crate-type = ["lib"]

[dependencies]
aes-kw = { version = "0.2", features = ["alloc"] }
argon2 = { version = "0.5", features = ["zeroize"] }
base64 = "0.22"
bip39 = "2"
chacha20poly1305 = "0.10"
data-encoding = "2"
hkdf = "0.12"
hmac = "0.12"
memsec = "0.7"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
unicode-normalization = "0.1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }
zxcvbn = "3"

[dev-dependencies]
tempfile = "3"
