# 本地开发环境：PostgreSQL 16 + Redis 7 + ZeroOne 同步服务
#   docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zeroone
      POSTGRES_USER: zeroone
      POSTGRES_PASSWORD: zeroone-dev
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeroone"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  server:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ZO_ADDR: ":8787"
      ZO_DATABASE_URL: postgres://zeroone:zeroone-dev@postgres:5432/zeroone?sslmode=disable
      # 开发专用密钥，生产环境务必用 `openssl rand -hex 32` 生成并放入密钥管理服务
      ZO_SERVER_SECRET: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
    ports: ["8787:8787"]

volumes:
  pgdata:
