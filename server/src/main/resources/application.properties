spring.application.name=vaultone-java-s1
spring.threads.virtual.enabled=true
spring.main.keep-alive=true
# 地址默认回环；生产地址/TLS必须由部署方显式配置，启动检查仍会执行。
server.address=0.0.0.0
server.port=9777
server.forward-headers-strategy=none
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.generate-ddl=false
spring.jpa.properties.hibernate.default_batch_fetch_size=32
# 绑定值与结果可能包含敏感材料，默认关闭，启动门禁拒绝危险覆盖。
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.extract=OFF
logging.level.org.hibernate.orm.results=OFF
spring.datasource.url=${VAULTONE_JDBC_URL:}
spring.datasource.username=${VAULTONE_DB_USER:}
spring.datasource.password=${VAULTONE_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.idle-timeout=600000
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migration/java
spring.flyway.table=vaultone_java_schema_history
# 不与 Rust 已有 sqlx 迁移历史混用；不自动认领现有非空库。
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db,redisConnectivity
spring.mvc.problemdetails.enabled=false
server.max-http-request-header-size=8KB
management.health.redis.enabled=false
vaultone.server-secret=${VAULTONE_SERVER_SECRET:}
vaultone.redis.address=${VAULTONE_REDIS_ADDRESS:}
vaultone.redis.password=${VAULTONE_REDIS_PASSWORD:}
vaultone.development.enabled=false
