<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑单车</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #1f2a44;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  figure { margin: 0; width: min(96vw, 1000px); }
  svg { width: 100%; height: auto; display: block; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
  figcaption { color: #cfd8ee; text-align: center; margin-top: 14px; letter-spacing: .2em; }
</style>
</head>
<body>
<figure>
<svg id="scene" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只鹈鹕在路上骑单车">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec8f2"/>
      <stop offset="1" stop-color="#fde7c3"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6c8"/>
      <stop offset="0.6" stop-color="#ffd76a"/>
      <stop offset="1" stop-color="#ffd76a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe4ea"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9d1da"/>
      <stop offset="1" stop-color="#8e99a6"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#f07b2b"/>
    </linearGradient>
    <g id="cloud">
      <ellipse cx="0" cy="0" rx="42" ry="18" fill="#fff"/>
      <ellipse cx="-22" cy="-10" rx="22" ry="16" fill="#fff"/>
      <ellipse cx="14" cy="-16" rx="26" ry="20" fill="#fff"/>
    </g>
    <!-- 车轮：轮胎 + 轮圈 + 辐条 -->
    <g id="spokes" stroke="#9aa4ae" stroke-width="1.6">
      <line x1="-74" y1="0" x2="74" y2="0"/>
      <line x1="0" y1="-74" x2="0" y2="74"/>
      <line x1="-52" y1="-52" x2="52" y2="52"/>
      <line x1="-52" y1="52" x2="52" y2="-52"/>
      <line x1="-28" y1="-68" x2="28" y2="68"/>
      <line x1="-68" y1="-28" x2="68" y2="28"/>
      <line x1="-28" y1="68" x2="28" y2="-68"/>
      <line x1="-68" y1="28" x2="68" y2="-28"/>
    </g>
  </defs>

  <!-- 天空与远景 -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="660" cy="90" r="70" fill="url(#sun)"/>
  <g id="clouds" opacity="0.92">
    <use href="#cloud" x="120" y="80"/>
    <use href="#cloud" x="420" y="60"/>
    <use href="#cloud" x="720" y="130"/>
    <use href="#cloud" x="1000" y="90"/>
  </g>
  <path d="M0 330 Q120 270 240 315 T480 305 T800 300 L800 440 L0 440 Z" fill="#9fd08a"/>
  <path d="M0 360 Q160 320 320 352 T800 345 L800 440 L0 440 Z" fill="#7dbb6b"/>

  <!-- 道路 -->
  <rect y="440" width="800" height="60" fill="#55606b"/>
  <rect y="436" width="800" height="6" fill="#3f4851"/>
  <g id="dashes" fill="#f4f1de">
    <rect x="0"   y="466" width="50" height="6" rx="3"/>
    <rect x="100" y="466" width="50" height="6" rx="3"/>
    <rect x="200" y="466" width="50" height="6" rx="3"/>
    <rect x="300" y="466" width="50" height="6" rx="3"/>
    <rect x="400" y="466" width="50" height="6" rx="3"/>
    <rect x="500" y="466" width="50" height="6" rx="3"/>
    <rect x="600" y="466" width="50" height="6" rx="3"/>
    <rect x="700" y="466" width="50" height="6" rx="3"/>
    <rect x="800" y="466" width="50" height="6" rx="3"/>
  </g>

  <!-- 速度线 -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <line x1="120" y1="180" x2="200" y2="180"><animate attributeName="opacity" values="0;1;0" dur="0.9s" repeatCount="indefinite"/></line>
    <line x1="90"  y1="215" x2="190" y2="215"><animate attributeName="opacity" values="0;1;0" dur="0.9s" begin="0.3s" repeatCount="indefinite"/></line>
    <line x1="130" y1="250" x2="200" y2="250"><animate attributeName="opacity" values="0;1;0" dur="0.9s" begin="0.6s" repeatCount="indefinite"/></line>
  </g>

  <!-- 地面阴影 -->
  <ellipse cx="385" cy="442" rx="210" ry="9" fill="#000" opacity="0.18"/>

  <g id="rider" transform="translate(0,0)">
    <!-- 远侧腿与远侧曲柄（在车架后面） -->
    <g id="farLeg" stroke="#d9822b" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.85">
      <polyline id="farLegLine" points="0,0 0,0 0,0"/>
    </g>
    <line id="farCrank" x1="370" y1="370" x2="370" y2="400" stroke="#4b5560" stroke-width="6" stroke-linecap="round"/>
    <rect id="farPedal" x="-10" y="-3" width="20" height="6" rx="2" fill="#4b5560"/>
    <path id="farFoot" d="" fill="#c9721f"/>

    <!-- 车轮 -->
    <g>
      <circle cx="250" cy="360" r="80" fill="none" stroke="#23282e" stroke-width="9"/>
      <circle cx="250" cy="360" r="74" fill="none" stroke="#c0c7cf" stroke-width="3"/>
      <use id="rearSpokes" href="#spokes" x="250" y="360"/>
      <circle cx="250" cy="360" r="7" fill="#7a848e"/>
    </g>
    <g>
      <circle cx="520" cy="360" r="80" fill="none" stroke="#23282e" stroke-width="9"/>
      <circle cx="520" cy="360" r="74" fill="none" stroke="#c0c7cf" stroke-width="3"/>
      <use id="frontSpokes" href="#spokes" x="520" y="360"/>
      <circle cx="520" cy="360" r="7" fill="#7a848e"/>
    </g>

    <!-- 链条 -->
    <g stroke="#3a4048" stroke-width="2.5" fill="none">
      <line x1="370" y1="352" x2="250" y2="352"/>
      <line x1="370" y1="388" x2="250" y2="368"/>
    </g>
    <circle cx="250" cy="360" r="9" fill="none" stroke="#3a4048" stroke-width="3"/>

    <!-- 车架 -->
    <g stroke="#e23d4b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="370" y1="370" x2="250" y2="360"/>   <!-- 后下叉 -->
      <line x1="345" y1="266" x2="250" y2="360"/>   <!-- 后上叉 -->
      <line x1="370" y1="370" x2="343" y2="258"/>   <!-- 立管 -->
      <line x1="345" y1="266" x2="490" y2="258"/>   <!-- 上管 -->
      <line x1="370" y1="370" x2="494" y2="284"/>   <!-- 下管 -->
      <line x1="488" y1="250" x2="497" y2="290"/>   <!-- 头管 -->
    </g>
    <line x1="497" y1="290" x2="520" y2="360" stroke="#b9c2cb" stroke-width="6" stroke-linecap="round"/> <!-- 前叉 -->
    <!-- 车把 -->
    <path d="M488 252 L486 230 L470 224" stroke="#2f353c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <line x1="470" y1="224" x2="460" y2="226" stroke="#111" stroke-width="8" stroke-linecap="round"/>
    <!-- 车座 -->
    <line x1="343" y1="258" x2="340" y2="250" stroke="#2f353c" stroke-width="5"/>
    <path d="M318 248 Q340 240 362 247 Q345 256 318 252 Z" fill="#2f353c"/>

    <!-- 鹈鹕身体（随踩踏轻微起伏） -->
    <g id="pelican">
      <!-- 尾羽 -->
      <path d="M268 196 L228 186 L238 200 L224 212 L270 214 Z" fill="#aeb8c3"/>
      <!-- 躯干 -->
      <ellipse cx="320" cy="205" rx="72" ry="44" fill="url(#body)" transform="rotate(-12 320 205)"/>
      <!-- 脖子 -->
      <path d="M372 190 C392 170 380 140 404 118" stroke="#ffffff" stroke-width="28" stroke-linecap="round" fill="none"/>
      <path d="M372 190 C392 170 380 140 404 118" stroke="#e6eaee" stroke-width="28" stroke-linecap="round" fill="none" opacity="0.25"/>
      <!-- 翅膀，伸向车把 -->
      <path d="M268 182 Q320 160 372 176 Q420 196 466 218 Q470 228 458 232 Q404 222 350 222 Q300 220 270 206 Z" fill="url(#wing)"/>
      <path d="M300 200 Q340 206 380 204 M318 212 Q360 216 400 214" stroke="#7b8693" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M440 214 l14 6 M432 222 l16 6" stroke="#5f6a76" stroke-width="2" stroke-linecap="round"/>
      <!-- 头 -->
      <circle cx="414" cy="104" r="24" fill="#ffffff"/>
      <path d="M398 86 Q392 70 404 74 Q406 64 414 74 Q420 66 422 80" fill="#f5e6a8"/>
      <!-- 喉囊 -->
      <path d="M424 118 Q470 172 548 132 Q520 124 432 112 Z" fill="url(#pouch)"/>
      <!-- 上喙 -->
      <path d="M426 98 Q490 108 556 124 Q566 128 558 134 Q548 136 546 130 Q480 124 428 116 Z" fill="#f2a93b"/>
      <path d="M430 108 Q490 118 546 130" stroke="#c97a1e" stroke-width="1.5" fill="none"/>
      <!-- 眼睛 -->
      <circle cx="418" cy="98" r="5.5" fill="#1b1b1b"/>
      <circle cx="419.8" cy="96.3" r="1.8" fill="#fff"/>
      <path d="M410 92 Q418 88 426 92" stroke="#e7c38a" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- 牙盘与近侧曲柄 -->
    <circle cx="370" cy="370" r="18" fill="none" stroke="#3a4048" stroke-width="4"/>
    <circle cx="370" cy="370" r="5" fill="#3a4048"/>
    <line id="nearCrank" x1="370" y1="370" x2="370" y2="340" stroke="#2f353c" stroke-width="7" stroke-linecap="round"/>
    <rect id="nearPedal" x="-12" y="-3.5" width="24" height="7" rx="2" fill="#2f353c"/>

    <!-- 近侧腿 -->
    <g stroke="#f08a2c" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline id="nearLegLine" points="0,0 0,0 0,0"/>
    </g>
    <path id="nearFoot" d="" fill="#e0791f"/>
  </g>

  <text x="400" y="34" text-anchor="middle" font-size="22" fill="#1f3b57" font-weight="bold" letter-spacing="4">鹈鹕出门兜风</text>
</svg>
<figcaption>SVG · 鹈鹕骑单车</figcaption>
</figure>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const BB = { x: 370, y: 370 };     // 中轴
  const HIP = { x: 345, y: 232 };    // 髋关节（相对身体静止位置）
  const CRANK = 30, THIGH = 84, SHIN = 84;
  const WHEEL_R = 80;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // 两段式反向运动学：已知髋与脚，求膝盖位置（膝盖朝前）
  function knee(hip, foot) {
    const dx = foot.x - hip.x, dy = foot.y - hip.y;
    const d = Math.min(Math.hypot(dx, dy), THIGH + SHIN - 0.01);
    const a = (THIGH * THIGH - SHIN * SHIN + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(THIGH * THIGH - a * a, 0));
    const ux = dx / d, uy = dy / d;
    return { x: hip.x + a * ux + h * uy, y: hip.y + a * uy - h * ux };
  }

  // 蹼足：以踏板为中心画一只三趾脚
  function footPath(p) {
    const x = p.x, y = p.y - 4;
    return `M${x - 8} ${y} Q${x + 4} ${y - 6} ${x + 18} ${y - 1} L${x + 14} ${y + 3} L${x + 10} ${y + 1} L${x + 6} ${y + 4} L${x + 2} ${y + 1} L${x - 2} ${y + 4} Q${x - 10} ${y + 3} ${x - 8} ${y} Z`;
  }

  function drawLeg(lineId, footId, pedalId, crankId, angle, bob) {
    const p = { x: BB.x + CRANK * Math.cos(angle), y: BB.y + CRANK * Math.sin(angle) };
    const hip = { x: HIP.x, y: HIP.y + bob };
    const k = knee(hip, p);
    $(lineId).setAttribute('points', `${hip.x},${hip.y} ${k.x},${k.y} ${p.x},${p.y - 4}`);
    $(footId).setAttribute('d', footPath(p));
    $(pedalId).setAttribute('transform', `translate(${p.x} ${p.y})`);
    $(crankId).setAttribute('x2', p.x);
    $(crankId).setAttribute('y2', p.y);
  }

  const clouds = [...document.querySelectorAll('#clouds use')];
  const CLOUD_X = clouds.map(c => Number(c.getAttribute('x')));

  let dist = 0, last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    if (!reduce) dist += dt * 160;

    const crankAngle = dist / 45;                    // 踏频
    const wheelDeg = (dist / WHEEL_R) * 180 / Math.PI;
    const bob = Math.sin(crankAngle * 2) * 1.6;      // 每圈两次起伏

    $('rearSpokes').setAttribute('transform', `rotate(${wheelDeg} 250 360)`);
    $('frontSpokes').setAttribute('transform', `rotate(${wheelDeg} 520 360)`);
    $('pelican').setAttribute('transform', `translate(0 ${bob})`);

    drawLeg('nearLegLine', 'nearFoot', 'nearPedal', 'nearCrank', crankAngle, bob);
    drawLeg('farLegLine', 'farFoot', 'farPedal', 'farCrank', crankAngle + Math.PI, bob);

    // 路面虚线与云朵向后移动，营造前进感
    $('dashes').setAttribute('transform', `translate(${-(dist % 100)} 0)`);
    // 每朵云单独循环：从左侧画外移出后回到右侧画外，避免整组跳变
    clouds.forEach((c, i) => {
      const x = (((CLOUD_X[i] - dist * 0.15) % 1100) + 1100) % 1100 - 100;
      c.setAttribute('x', x);
    });

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
